name: Trigger Dependent Repository Rebuild

on:
  push:
    branches:
      - main

jobs:
  trigger-rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger shared-tails-server rebuild
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.REPO_DISPATCH_TOKEN }}" \
            https://api.github.com/repos/AndrewKhorsun/shared-tails-server/dispatches \
            -d '{"event_type":"dependency-updated"}'

      - name: Log trigger event
        run: |
          echo "✅ Triggered rebuild for shared-tails-server"
          echo "Event type: dependency-updated"
          echo "Time: $(date)"